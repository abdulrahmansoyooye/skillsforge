openapi:  3.0.3
info: 
    title: Expense Tracker API
    version: 1.0.0
    description: Personal expense tracking with catgories, filtering, summaries and budgets
servers: 
    - url: http://locacalhost:4000
components: 
  securitySchemas: 
    bearerAuth: 
     type:  http
     scheme:  bearer
     bearerFormat:  JWT
  schemas: 
    Credentials: 
      type:  object
      required: [email,password]
      properties: 
       email:  {type: string,format: email,example: abdulrahaman@example.com}
       password:  {type: string,minLength: 8,example: password12345}
    Category: 
      type:  object
      properties: 
       id:  {type: string,format: uuid}
       name: {type: string, example:  food}
    Error: 
      type:  object
      properties: 
        error:  {type:  string}
paths:
  /health: 
    get: 
      summary: Health check including database status
      tags: [System]
      responses :
        '200': [description: Service and database are up] 
        '503': [description: Database is down]
  /auth/register:
    post: 
      summary: Register a new user
      tags: [Auth] 
      requestBody:
       required: true
       content:
         application/json:
          schema: {$ref: '#/components/schemas/Credentials'}
      responses: 
        '201': {description: User created}
        '400': {description: Validation failed}
        '409': {description: Email already registered}
  /auth/login:
    post:
     summary: Login a registered user
     tags: [Auth]
     requestBody:
      required: true
      content: 
        application/json: 
          schema: {$ref: '#/components/schemas/Credentials'}
     responses:
      '200': {description: 'Returns {token}'}
      '401': {description: Invalid email of password}
  /categories:
   get:
    summary: List the current user's categories
    tag: [Categories]
    security: [{bearerAuth: []}]
    responses: 
     '200': 
      description: List of categories
      content: 
       application/json:
        schema: 
         type: array
         item: {$ref: '#/components/schema/Category'}
  /expenses:
    get: 
      responses:
        '200':
            desctiption: List of expenses
            content:
              application/json: 
                 schema: 
                  type: array
                  